(()=>{'use strict';const AAD='phone-research-snapshot:v1:gzip',envelope=JSON.parse(document.getElementById('encrypted-dashboard').textContent);const unlock=document.getElementById('unlock'),dashboard=document.getElementById('dashboard'),view=document.getElementById('view'),status=document.getElementById('status'),input=document.getElementById('access');let bundle=null,keyText=null,currentDate=null,route='#overview';const routes=new Set(['overview','listings','bid-today','review','tracked','market-test','comps','watchpatrol','sources','results']);
function bytes(s){return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));}
function getKey(value){const s=String(value||'').trim();if(/^[A-Za-z0-9_-]{43}$/.test(s))return s;try{return new URLSearchParams(new URL(s).hash.slice(1)).get('key');}catch{return null;}}
function validRoute(value){return typeof value==='string'&&value.length<2000&&/^#[a-z-]+(?:\?[^#]*)?$/.test(value)&&routes.has(value.slice(1).split('?')[0]);}
function showDay(date,nextRoute){if(!bundle||!Object.hasOwn(bundle.pages,date))return;currentDate=date;route=validRoute(nextRoute)?nextRoute:'#overview';view.srcdoc=bundle.pages[date];}
view.addEventListener('load',()=>{if(bundle)view.contentWindow.postMessage({type:'watch-dashboard-route',route},'*');});
window.addEventListener('message',event=>{const m=event.data;if(event.source!==view.contentWindow||!m||m.type!=='watch-dashboard-date'||typeof m.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(m.date))return;showDay(m.date,m.route);});
async function open(value){const key=getKey(value);if(!/^[A-Za-z0-9_-]{43}$/.test(key||'')){status.textContent='Use the complete personal link or access key.';return;}status.textContent='Opening your saved dashboard…';try{if(!crypto.subtle||typeof DecompressionStream!=='function')throw new Error('browser');if(envelope.version!==1||envelope.algorithm!=='AES-256-GCM'||envelope.compression!=='gzip')throw new Error('version');const raw=bytes(key);if(raw.length!==32)throw new Error('key');const imported=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const zipped=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(envelope.iv),additionalData:new TextEncoder().encode(AAD),tagLength:128},imported,bytes(envelope.ciphertext));const plain=await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const next=JSON.parse(plain);if(next.version!==1||!next.pages||!Object.hasOwn(next.pages,next.latestDate)||Object.values(next.pages).some(v=>typeof v!=='string'||!v.startsWith('<!doctype html>')))throw new Error('bundle');bundle=next;keyText=key;input.value='';status.textContent='';history.replaceState(null,'',location.pathname+location.search+'#key='+key);unlock.hidden=true;dashboard.hidden=false;document.getElementById('published').textContent='Saved '+new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date(bundle.generatedAt))+' · read-only';showDay(bundle.latestDate,route);}catch(err){bundle=null;keyText=null;view.removeAttribute('srcdoc');dashboard.hidden=true;unlock.hidden=false;status.textContent=err.message==='browser'?'Update your browser to open this dashboard.':'This link did not unlock the dashboard. Use the latest personal access link.';}}
document.getElementById('unlock-form').addEventListener('submit',e=>{e.preventDefault();open(input.value);});document.getElementById('refresh').addEventListener('click',()=>location.reload());document.getElementById('lock').addEventListener('click',()=>{bundle=null;keyText=null;view.removeAttribute('srcdoc');view.src='about:blank';dashboard.hidden=true;unlock.hidden=false;history.replaceState(null,'',location.pathname+location.search);status.textContent='Locked. Use your personal link to open it again.';});const supplied=new URLSearchParams(location.hash.slice(1)).get('key');if(supplied)open(supplied);
